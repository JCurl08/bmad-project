type = "story"
title = "Fragments and face repair"
description = "Rolls die numbers per run (Town 1, the others 2-6 shuffled), places k numbered fragments on the face numbered k behind roadblocks, adds each leader's quest to bring them all and repair the face, shows fragments on the HUD and map, and applies one boss benefit per repaired face (fewer particles, wider gap, attraction, slower restore, +1 heart, slower and rarer shots); the plan decides whether faces map to benefits by seed or fixed."
verify = "On seeds 1-50 every fragment is reachable, Town is always 1 and other numbers vary; handing all fragments to a leader marks the face repaired; each benefit measurably changes its arena parameter in a test; the no-benefit skill check still lands in 60-120 s; all suites and the sweep pass."
covers = ["CAP-29", "CAP-11"]
