# tickets.toml — epic-world-worth-exploring's agreed stories. The order of the tables is the build order.

[[entry]]
id = 1
type = "story"
title = "Bigger screens, thinner walls"
description = "Rescales every screen to about 24x15 tiles (about twice the area) on the 960x600 canvas, with half-tile edge walls and people drawn larger, and rescales modules, layouts, face plans, spot filters, the sweep and the tests to match, re-recording the determinism fixture; checks the WebGL build size and memory after the change."
verify = "Every screen on seeds 1-50 is about 24x15 tiles with a centred doorway per side, all suites pass, the 50-seed sweep passes, the determinism signatures are re-recorded and stable across two runs, and a WebGL build loads within budget."
covers = ["CAP-2"]
after = ["1.26"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "spike"
title = "Puzzle difficulty research"
description = "Surveys shipped games' versions of each puzzle type (sliding ice such as Pokemon ice paths, Zelda-style currents and wind, bridge and Euler puzzles, island-bridge puzzles such as Hashiwokakero, boulder and Sokoban-lite puzzles, lamp and ordering puzzles) and writes difficulty targets per generator: solution length, branching and red herrings."
verify = "A research note beside this epic gives, for each generator (islands, sliding ice, wind streams, boulders, existing face puzzles), cited examples and numeric targets that entries 10-12 can test against."
covers = ["CAP-7", "CAP-8"]
after = []
hitl = false
risk = "low"

[[entry]]
