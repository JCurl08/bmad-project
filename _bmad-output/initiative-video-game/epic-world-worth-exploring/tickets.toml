title = "Character redesign"
description = "Draws one hand-made design per race in the player character's style (shape people, finches, Chemistry folk, Physics folk, ground and avian dinosaurs, townsfolk), with a distinct leader variant per race, at the new larger size; the swappable-parts system stays in code, unused by default, for epic-varied-runs."
verify = "Every race spawns with its new design on every face and in Town, leaders are visibly distinct, the parts system still compiles and its tests pass behind its switch, and all suites and the sweep pass."
