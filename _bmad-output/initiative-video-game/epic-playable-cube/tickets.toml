[[entry]]
id = 15
type = "story"
title = "Readability pass"
description = "Replaces code-drawn placeholder shapes with Kenney Tiny Dungeon/Tiny Town sprites for the player, walls, floors, doors, gates, items and enemies; redraws NPC Lego parts as clean outlined parts with a distinct silhouette per race; adds feedback (hit flashes, gate-open effects, pickup popups, clear isotope stage); trims NPC dialogue to one flavour line plus the hint with a skip key; changes the death text to 'You were defeated'."
verify = "A first-time player can tell the player, NPCs, enemies, items, gates and walls apart at a glance, sees feedback for hits, pickups and gate openings, and gets through each NPC conversation in one or two presses; all existing tests still pass."
covers = ["CAP-9", "CAP-10", "CAP-3"]
