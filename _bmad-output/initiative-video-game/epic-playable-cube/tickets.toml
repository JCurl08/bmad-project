hitl = true
risk = "medium"
notes = ["User: 'I would like everything to have more clear models. It is far too confusing currently.'", "User: 'The dialogue is a bit too long currently. Makes testing a little inefficient'", "User chose: Kenney asset pack for the world; keep the stacked Lego parts for NPCs (option 2)."]

