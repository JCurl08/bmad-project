description = "Adds the core arena, entered through each built face's core-entrance slot (entry 3) and open from run 1, with a single-phase Maxwell's Demon beaten by mixing an ordered arena faster than it restores order, a phase slot for later phases, and win/lose states that raise a run-end event (entry 12 acts on it); in-game text and imagery speak of the Partition and never say sort; falls back to a simpler boss if the demon is not working."
