# tickets.toml — epic-playable-cube's agreed stories. The order of the tables is the build order.

[[entry]]
id = 1
type = "story"
title = "Unity project and WebGL tracer"
description = "Creates the Unity 2D (URP) project in game/ with a Unity .gitignore and Git LFS, pushed to the JCurl08/bmad-project remote, and proves the pipeline end to end: a top-down player walks between two placeholder screens, audio starts only after the first input, and a PlayerPrefs value saves and loads, in a WebGL build uploaded to a restricted itch.io page the developer creates."
verify = "The WebGL build opens from the itch.io page, the player walks from one screen to the other, audio plays after the first click, and a saved value is still there after reloading the tab."
covers = ["CAP-2"]
after = []
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Seeded cube model and debug tools"
description = "Builds the seeded random source and the cube model: 6 faces of N×N screens (a face-size setting, 2×2 in this epic so epic-varied-runs can raise it to 3×3), edge adjacency between faces, and sealed-face slots for faces not built yet; adds a debug overlay (face, screen, seed), seed reroll, jump-to-screen, a seed-sweep tool that checks every unsealed screen is reachable, and Unity Test Framework (EditMode) with a seed-determinism test."
verify = "The determinism test passes (same seed, identical cube; different seeds, different arrangements), walking off any face edge lands on the correct adjacent face or a sealed boundary, and the seed sweep reports reachability for 50 seeds."
covers = ["CAP-1", "CAP-2"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Screen modules and the town-exit shuffle"
description = "Adds hand-built screen modules with tagged entry/exit points, gate slots, hidden-item slots and a core-entrance slot; keeps the Town face fixed as the start; and rearranges the built science faces and their screens when the player leaves town, leaving unbuilt faces sealed; provides placeholder modules for science faces whose story is not done yet; and extends the seed sweep to report a reachable core-entrance slot on every built face."
verify = "Each new run starts on the Town face, leaving town produces a layout that differs between seeds and is reproduced exactly by the same seed, unbuilt faces stay sealed, every module's slots show in the debug view, and the sweep reports a reachable core entrance per face."
covers = ["CAP-1"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Items, gates, one-way gates and trial rooms"
description = "Adds the inventory and item pickup; gates as data bound to the item that opens them, placed by a seeded placer into module gate slots (mostly on the item's home face, at least one elsewhere); the one-way gate as the reusable commitment mechanic; a trial-room completion event carrying a currency amount that face trials use; and a softlock check in the seed sweep."
verify = "A placeholder item opens its gates on and off its home face, a one-way gate can be crossed in one direction only, a placeholder trial fires its completion event, and the seed sweep flags a seed whose required gate comes before its item."
covers = ["CAP-3", "CAP-25"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Lego NPCs and dialogue"
description = "Assembles NPCs for every race, including the sealed faces' shape people and dinosaurs (placeholder art), from head (hint), torso (role, including merchant) and leg (movement) parts chosen by the seed, with a dialogue system for campy lines and a sparse first-run hint set, and exposes a per-race hostility flag for later use."
verify = "NPC parts differ between seeds, each slot visibly changes what the NPC says or does, and setting a race's hostility flag in debug makes its NPCs stop talking."
covers = ["CAP-9", "CAP-12"]
after = [2]
hitl = false
risk = "low"

[[entry]]
