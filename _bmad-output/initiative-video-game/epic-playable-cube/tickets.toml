title = "Run loop, meta currency and upgrades"
description = "Ends a run on player death (entry 6) or the boss's run-end event (entry 11), resets abilities and rolls a new seed; pays meta currency on trial completion events (entry 4), the core boss, and hidden meta-currency items it places in hidden-item slots (entry 3); adds the stat upgrade shop; saves meta progress in a versioned, extensible save format that tracks per-ability versions; and tunes first-run difficulty."
verify = "After a run ends, the next run starts in town with reset abilities and a new layout, and upgrades bought and the meta-currency balance are still there after reloading the browser tab."
covers = ["CAP-12", "CAP-13", "CAP-25"]
