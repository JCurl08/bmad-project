[[entry]]
id = 8
type = "story"
title = "Biology face (Darwin), vertical slice"
description = "Builds the Biology face end to end at 2×2: a random-per-run beak adaptation (thin beak presses distant buttons and pollinates flowers that grow bridges or vines; thick beak breaks pots and rocks), beak gates with a difficulty parameter (e.g. number of beak gates), where only the rolled beak's gates are required and the other type's gates are optional, a rule added to the seed sweep's softlock check; a harder trial puzzle combining beak mechanics that fires entry 4's completion event, its enemy types (each weak to an item, on entry 6's enemy base), the finch part set from entry 5 dressed with face dialogue and art, and modules carrying entry 3's gate slots (including slots for other faces' items), hidden-item slots and one core-entrance slot (entry 3)."
verify = "On full runs from town with seeds that roll each beak type, the player gets a beak, solves its required gates (a thin-beak seed includes a pollinated bridge on an adjacent screen) and the Biology trial; each face enemy is markedly easier with its weakness item; the beak opens at least one gate on another face (a placeholder screen until Chemistry and Physics exist)."
covers = ["CAP-4", "CAP-25", "CAP-10", "CAP-3"]
after = [6, 7]
hitl = false
risk = "medium"

[[entry]]
