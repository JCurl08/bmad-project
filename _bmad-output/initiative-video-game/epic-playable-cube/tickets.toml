type = "story"
title = "Chemistry face (Curie)"
description = "Builds the Chemistry face at 2×2: the re-obtainable decay item with half-life stages (glow lights dark rooms, unstable blasts walls, lead holds switches) and a difficulty parameter (e.g. half-life length), its gates, a softlock-check rule that the item is reachable again before stage-gated gates, a harder trial puzzle combining decay stages, its enemy types on entry 6's enemy base, the mushroom-people part set from entry 5 dressed with face dialogue and art, and modules carrying entry 3's gate slots (including slots for other faces' items), hidden-item slots and one core-entrance slot."
verify = "Each decay stage solves its puzzle type, the item can be re-obtained after full decay, the Chemistry trial pays out, each face enemy is markedly easier with its weakness item, and the decay item opens at least one gate on another face."
covers = ["CAP-5", "CAP-25", "CAP-10", "CAP-3"]
after = [8]
hitl = false
risk = "medium"

[[entry]]
id = 10
type = "story"
title = "Physics face (Einstein)"
description = "Builds the Physics face at 2×2: draggable boulders whose mass slows time near timed doors (more mass, more slowing, with a difficulty parameter for boulder count), its gates, a softlock-check rule that enough boulders are reachable for each required timed door, a harder trial puzzle with several timed doors, its enemy types on entry 6's enemy base, the alien part set from entry 5 dressed with face dialogue and art, and modules carrying entry 3's gate slots (including slots for other faces' items), hidden-item slots and one core-entrance slot."
verify = "A timed door that can't be passed without boulders becomes passable with the required boulders beside it, the Physics trial pays out, each face enemy is markedly easier with its weakness item, and the boulder mechanic opens at least one gate on another face."
covers = ["CAP-6", "CAP-25", "CAP-10", "CAP-3"]
after = [8, 9]
hitl = false
risk = "medium"

